<script>
(function () {
  var A = OW.Art, FX = OW.FX;
  var Q = {}; location.search.slice(1).split('&').forEach(function (kv) { if (!kv) return; var p = kv.split('='); Q[p[0]] = decodeURIComponent(p[1] || ''); });
  var SEC = Q.s || 'all', Z = +(Q.z || 1), T0 = +(Q.t || 1.3), ANIM = Q.anim === '1';
  var THEMES = ['startup', 'coworking', 'consulting', 'corporate', 'quarterclose'];
  var TYPES = ['counter', 'src_budget', 'src_plan', 'src_report', 'desk', 'printer', 'approval', 'folder_stack', 'meeting_room', 'minutes',
    'shredder', 'coffee', 'phone', 'team_desk', 'plant', 'bookshelf', 'whiteboard', 'conveyor', 'wall', 'compiler'];
  var NPCS = [{ name: 'Laia', color: '#ff9a3c', idx: 0 }, { name: 'Marc', color: '#21c7c1', idx: 1 }, { name: 'Núria', color: '#a66cff', idx: 2 }, { name: 'Pau', color: '#3ddc84', idx: 3 }, { name: 'Jordi', color: '#4da3ff', idx: 4 }, { name: 'Aina', color: '#ff6b9a', idx: 5 }];
  var sections = [];
  function section(id, title, w, h, draw) { sections.push({ id: id, title: title, w: w, h: h, draw: draw }); }
  function label(ctx, s, x, y, c) { ctx.save(); ctx.font = 'bold 11px ' + A.FONT; ctx.fillStyle = c || '#bdb6e6'; ctx.textAlign = 'center'; ctx.fillText(s, x, y); ctx.restore(); }

  A.init();

  section('stations', 'Estacions × temes (idle)', TYPES.length * 80 + 120, 5 * 180 + 30, function (ctx, t) {
    THEMES.forEach(function (th, r) {
      var y0 = 80 + r * 180;
      ctx.fillStyle = A.theme(th).floor; ctx.fillRect(100, y0 - 70, TYPES.length * 80, 170);
      label(ctx, th, 50, y0 + 30, '#ffd23f');
      TYPES.forEach(function (ty, c) {
        var x = 110 + c * 80;
        var st = { type: ty, theme: th, state: 'idle', dir: c % 2 ? 'down' : 'right' };
        if (ty === 'team_desk') st.npc = NPCS[r];
        A.drawStation(ctx, st, x, y0, 64, t + c * 0.3);
        if (r === 0) label(ctx, ty, x + 32, 14);
      });
    });
  });

  section('states', 'Estats de les estacions', 1500, 820, function (ctx, t) {
    ctx.fillStyle = A.theme('coworking').floor; ctx.fillRect(0, 0, 1500, 820);
    var rows = [
      ['printer', [['idle'], ['working', 0.55], ['done'], ['warning', 0.8], ['burnt'], ['blocked']]],
      ['desk', [['idle'], ['working', 0.4], ['fire'], ['blocked']]],
      ['approval', [['idle'], ['working', 0.6], ['done']]],
      ['phone', [['idle'], ['ringing'], ['working', 0.5]]],
      ['team_desk', [['idle'], ['wants'], ['working', 0.6]]],
      ['meeting_room', [['idle'], ['busy']]],
      ['minutes', [['idle'], ['working', 0.5]]],
      ['shredder', [['idle'], ['working']]],
      ['src_budget', [['working']]], ['src_plan', [['working']]], ['src_report', [['working']]], ['coffee', [['working', 0.7]]]
    ];
    var x = 30, y = 80;
    rows.forEach(function (row, ri) {
      row[1].forEach(function (sv, i) {
        if (x > 1400) { x = 30; y += 190; }
        var st = { type: row[0], theme: 'coworking', state: sv[0], progress: sv[1] };
        if (sv[0] === 'ringing') { st.state = 'idle'; st.ringing = true; }
        if (sv[0] === 'wants') { st.state = 'idle'; st.wants = true; }
        if (sv[0] === 'busy') { st.state = 'idle'; st.busy = 0.8; }
        if (row[0] === 'team_desk') st.npc = NPCS[i + 1];
        if (sv[0] === 'blocked') st.blocked = true;
        A.drawStation(ctx, st, x, y, 64, t);
        if (sv[0] === 'fire' || sv[0] === 'burnt') A.drawFire(ctx, x, y, 64, 0.7, t);
        label(ctx, row[0] + ' ' + sv[0] + (sv[1] != null ? ' ' + sv[1] : ''), x + 32, y + 100, '#fff');
        x += 110;
      });
    });
    // sala de reuniones unida en vertical + cintas
    y += 190; x = 30;
    A.drawStation(ctx, { type: 'meeting_room', theme: 'corporate' }, x, y, 64, t);
    A.drawStation(ctx, { type: 'meeting_room', theme: 'corporate', joinTop: true, busy: 0.6 }, x, y + 64, 64, t);
    label(ctx, 'meeting_room joinTop', x + 32, y + 160, '#fff');
    ['right', 'left', 'up', 'down'].forEach(function (d, i) {
      A.drawStation(ctx, { type: 'conveyor', theme: 'corporate', dir: d }, 200 + i * 90, y, 64, t);
      label(ctx, 'conveyor ' + d, 232 + i * 90, y + 100, '#fff');
    });
    // highlight
    A.drawStation(ctx, { type: 'desk', theme: 'startup', highlight: true }, 600, y, 64, t); label(ctx, 'highlight', 632, y + 100, '#fff');
    A.drawStation(ctx, { type: 'printer', theme: 'startup', state: 'done' }, 700, y, 64, t);
    A.drawItem(ctx, { kind: 'printout', lane: 'budget' }, 700 + A.itemAnchor('printer').x, y + A.itemAnchor('printer').y, 1, t);
    label(ctx, 'printer + printout', 732, y + 100, '#fff');
    A.drawStation(ctx, { type: 'folder_stack', theme: 'startup' }, 800, y, 64, t);
    for (var k = 0; k < 3; k++) A.drawItem(ctx, { kind: 'dossier', contents: [], noShadow: k > 0 }, 832, y + 24 - k * 4, 0.9, t);
    A.drawStation(ctx, { type: 'minutes', theme: 'startup' }, 900, y, 64, t);
    A.drawItem(ctx, { kind: 'dossier_minutes', contents: [] }, 918, y + 30, 0.72, t); A.drawItem(ctx, { kind: 'dossier', contents: [] }, 934, y + 34, 0.72, t);
  });

  section('items', 'Items per kind/lane (escala 1, 1.5 i 3)', 1400, 640, function (ctx, t) {
    var kinds = ['brief', 'draft', 'printout', 'approved', 'burnt'];
    var lanes = ['budget', 'plan', 'report'];
    ctx.fillStyle = '#e3c08a'; ctx.fillRect(0, 0, 1400, 640);
    kinds.forEach(function (k, r) {
      lanes.forEach(function (l, c) {
        var x = 60 + c * 70, y = 50 + r * 64;
        A.drawItem(ctx, { kind: k, lane: l }, x, y, 1, t);
        if (r === 0) label(ctx, l, x, 14, '#3a2010');
      });
      label(ctx, k, 270, 50 + r * 64, '#3a2010');
      lanes.forEach(function (l, c) { A.drawItem(ctx, { kind: k, lane: l }, 340 + c * 80, 50 + r * 64, 1.5, t); });
    });
    var ds = [[], ['budget'], ['plan', 'report'], ['budget', 'plan', 'report']];
    ds.forEach(function (cc, i) {
      A.drawItem(ctx, { kind: 'dossier', contents: cc }, 640 + i * 90, 60, 1.5, t);
      label(ctx, 'dossier [' + cc.join(',') + ']', 640 + i * 90, 110, '#3a2010');
    });
    A.drawItem(ctx, { kind: 'dossier_minutes', contents: ['budget', 'report'] }, 640, 180, 1.5, t); label(ctx, 'dossier_minutes', 640, 230, '#3a2010');
    A.drawItem(ctx, { kind: 'extinguisher' }, 730, 180, 1.5, t); label(ctx, 'extinguisher', 730, 230, '#3a2010');
    A.drawItem(ctx, { kind: 'spec', lane: 'front' }, 820, 180, 1, t); label(ctx, 'alias spec/front', 820, 230, '#3a2010');
    A.drawItem(ctx, {}, 920, 180, 1, t); label(ctx, '{} buit', 920, 230, '#3a2010');
    ['brief', 'draft', 'printout', 'approved', 'burnt'].forEach(function (k, i) { A.drawItem(ctx, { kind: k, lane: ['budget', 'plan', 'report', 'budget', 'plan'][i] }, 80 + i * 140, 500, 3, t); });
    A.drawItem(ctx, { kind: 'dossier', contents: ['budget', 'plan', 'report'] }, 800, 500, 3, t);
    A.drawItem(ctx, { kind: 'dossier_minutes', contents: ['plan'] }, 960, 500, 3, t);
    A.drawItem(ctx, { kind: 'extinguisher' }, 1110, 500, 3, t);
    A.drawStation(ctx, { type: 'desk', theme: 'startup', state: 'working', progress: 0.5 }, 1080, 60, 64, t); A.drawItem(ctx, { kind: 'brief', lane: 'plan' }, 1080 + 32, 60 + 34, 1, t);
    A.drawStation(ctx, { type: 'approval', theme: 'startup', state: 'working', progress: 0.3 }, 1160, 60, 64, t); A.drawItem(ctx, { kind: 'printout', lane: 'report' }, 1160 + 25, 60 + 28, 1, t);
    A.drawStation(ctx, { type: 'meeting_room', theme: 'startup' }, 1240, 60, 64, t); A.drawItem(ctx, { kind: 'dossier', contents: ['budget'] }, 1272, 88, 1, t);
  });

  section('chars', 'Personatges: estils PM × cabells, accions, direccions, energia', 1400, 780, function (ctx, t) {
    ctx.fillStyle = A.theme('coworking').floor; ctx.fillRect(0, 0, 1400, 780);
    for (var c = 0; c < 4; c++) for (var h = 0; h < 4; h++) {
      A.drawCharacter(ctx, { x: 50 + (c * 4 + h) * 70, y: 100, dir: { x: 0, y: 1 }, colorIndex: c, hair: h, energy: 1 }, t + c + h);
    }
    var acts = ['none', 'typing', 'reviewing', 'calling', 'talking', 'stamping', 'drinking', 'spraying', 'squashing', 'stunned'];
    acts.forEach(function (a, i) {
      A.drawCharacter(ctx, { x: 60 + i * 100, y: 250, dir: { x: 0, y: 1 }, colorIndex: i % 4, hair: (i + 1) % 4, action: a, energy: 1 }, t);
      label(ctx, a, 60 + i * 100, 272, '#fff');
      A.drawCharacter(ctx, { x: 60 + i * 100, y: 370, dir: { x: 1, y: 0 }, colorIndex: (i + 1) % 4, hair: (i + 2) % 4, action: a, energy: 1 }, t);
    });
    var cp = A.getCarryPoint({ x: 1080, y: 250, dir: { x: 0, y: 1 } });
    A.drawCharacter(ctx, { x: 1080, y: 250, dir: { x: 0, y: 1 }, colorIndex: 0, hair: 0, carrying: true }, t); A.drawItem(ctx, { kind: 'approved', lane: 'budget' }, cp.x, cp.y, 0.8, t);
    label(ctx, 'carrying', 1080, 272, '#fff');
    var cp2 = A.getCarryPoint({ x: 1180, y: 370, dir: { x: 1, y: 0 } });
    A.drawCharacter(ctx, { x: 1180, y: 370, dir: { x: 1, y: 0 }, colorIndex: 1, hair: 1, carrying: true }, t); A.drawItem(ctx, { kind: 'dossier', contents: ['budget', 'plan'] }, cp2.x, cp2.y, 0.8, t);
    var dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
    for (var d = 0; d < 4; d++) for (var w = 0; w < 3; w++) {
      var x = 60 + (d * 3 + w) * 95;
      A.drawCharacter(ctx, { x: x, y: 500, dir: { x: dirs[d][0], y: dirs[d][1] }, colorIndex: d, hair: d, moving: true, walkPhase: w * 1.05, energy: 1, name: w === 0 ? 'P' + (d + 1) : null }, t);
    }
    label(ctx, 'caminant: avall / dreta / amunt / esquerra (3 fases)', 600, 525, '#fff');
    [[1, 'energia 1'], [0.25, '0.25'], [0.05, '0.05 zzz'], [1, 'selected'], [1, 'dashing']].forEach(function (e, i) {
      A.drawCharacter(ctx, { x: 80 + i * 130, y: 660, dir: { x: 0, y: 1 }, colorIndex: i % 4, hair: i % 4, energy: e[0], selected: i === 3, dashing: i === 4, name: i === 3 ? 'Ana' : null }, t);
      label(ctx, e[1], 80 + i * 130, 685, '#fff');
    });
    ctx.save(); ctx.translate(760, 570); ctx.scale(2.4, 2.4);
    for (var o = 0; o < 4; o++) A.drawCharacter(ctx, { x: o * 55, y: 75, dir: { x: 0, y: 1 }, colorIndex: o, hair: o, energy: 1, action: o === 2 ? 'calling' : 'none' }, t);
    ctx.restore();
  });

  section('misc', 'Notificacions, CEO, NPC, foc, efecte "reunió feta"', 1400, 540, function (ctx, t) {
    ctx.fillStyle = A.theme('consulting').floor; ctx.fillRect(0, 0, 1400, 540);
    for (var i = 0; i < 6; i++) A.drawBug(ctx, { x: 50 + i * 60, y: 60, angle: i * 1.05, phase: t * 18 + i, variant: i % 2 ? 'chat' : 'mail' }, t);
    [0, 0.2, 0.5, 1].forEach(function (s, i) { A.drawBug(ctx, { x: 420 + i * 70, y: 60, angle: 0.3, squashed: s, variant: i % 2 ? 'chat' : 'mail' }, t); label(ctx, 'squash ' + s, 420 + i * 70, 100, '#fff'); });
    ctx.save(); ctx.translate(720, -40); ctx.scale(3, 3); A.drawBug(ctx, { x: 30, y: 40, angle: -0.4, phase: t * 18, variant: 'mail' }, t); A.drawBug(ctx, { x: 75, y: 40, angle: 0, phase: t * 18, variant: 'chat' }, t); ctx.restore();
    A.drawManager(ctx, { x: 80, y: 300, dir: { x: 0, y: 1 }, talking: true }, t);
    A.drawManager(ctx, { x: 260, y: 300, dir: { x: 1, y: 0 }, moving: true, walkPhase: t * 8 }, t);
    A.drawManager(ctx, { x: 360, y: 300, dir: { x: 0, y: -1 }, moving: true, walkPhase: 1 }, t);
    ctx.save(); ctx.translate(380, 170); ctx.scale(2.2, 2.2); A.drawManager(ctx, { x: 40, y: 100, dir: { x: 0, y: 1 }, talking: true, textKey: 'art.ceo_idea' }, t); ctx.restore();
    [0.3, 1].forEach(function (I, i) {
      A.drawStation(ctx, { type: 'counter', theme: 'consulting', state: 'fire' }, 620 + i * 80, 380, 64, t);
      A.drawFire(ctx, 620 + i * 80, 380, 64, I, t + i);
      label(ctx, 'fire ' + I, 652 + i * 80, 480, '#fff');
    });
    [0.05, 0.3, 0.6, 0.9].forEach(function (p, i) { A.drawRocket(ctx, 880 + i * 120, 500, t, p); label(ctx, 'rocket ' + p, 880 + i * 120, 520, '#fff'); });
  });

  function demoOrders() {
    return [
      { kind: 'dossier', task: 'budget_meeting', nameKey: 'task.budget_meeting', lanes: ['budget'], timeLeft: 50, timeTotal: 60 },
      { kind: 'dossier', task: 'business', nameKey: 'task.business', lanes: ['budget', 'plan'], timeLeft: 30, timeTotal: 60 },
      { kind: 'dossier', task: 'board', nameKey: 'task.board', lanes: ['budget', 'plan', 'report'], timeLeft: 10, timeTotal: 70 },
      { kind: 'call', task: 'call', nameKey: 'task.call', lanes: [], timeLeft: 18, timeTotal: 25 },
      { kind: 'one2one', task: 'one2one', nameKey: 'task.one2one', nameParams: { name: 'Núria' }, target: 2, lanes: [], timeLeft: 40, timeTotal: 45, flash: 0.6 },
      { kind: 'dossier', nameKey: 'task.presentation', lanes: ['plan', 'report'], timeLeft: 55, timeTotal: 60, entering: 0.6 }
    ];
  }
  section('ui', 'UI: agenda, icones, panell, botons, barres (' + OW.I18N.lang + ')', 1400, 600, function (ctx, t) {
    A.drawMenuBackground(ctx, t);
    demoOrders().forEach(function (o, i) { A.drawOrderCard(ctx, o, 16 + i * 186, 14, 176, 100, t); });
    A.drawOrderCard(ctx, { kind: 'dossier', nameKey: 'task.steering', lanes: ['budget', 'report'], timeLeft: 20, timeTotal: 60 }, 16, 130, 130, 84, t);
    A.drawOrderCard(ctx, { kind: 'one2one', nameKey: 'task.one2one', nameParams: { name: 'Jordi' }, timeLeft: 20, timeTotal: 60 }, 160, 130, 130, 84, t, { highlight: true });
    A.drawOrderCard(ctx, { name: 'Legacy (sense nameKey)', lanes: ['front', 'data'], time: 20, maxTime: 60 }, 304, 130, 150, 84, t);
    A.drawOrderCard(ctx, {}, 468, 130, 130, 84, t);
    var icons = ['budget', 'plan', 'report', 'phone', 'calendar', 'one2one', 'mail', 'globe', 'dossier', 'printer', 'stamp', 'coffee', 'star', 'star_empty', 'clock', 'coin', 'bug', 'fire', 'rocket', 'key', 'nope'];
    icons.forEach(function (n, i) { A.drawIcon(ctx, n, 40 + i * 64, 250, 36); label(ctx, n, 40 + i * 64, 285, '#fff'); A.drawIcon(ctx, n, 640 + i * 26, 160, 16); });
    A.drawPanel(ctx, 30, 310, 420, 270, { title: 'Pausa' });
    A.drawButton(ctx, 80, 380, 320, 52, 'Continuar', true, t);
    A.drawButton(ctx, 80, 450, 320, 52, 'Reiniciar', false, t);
    A.drawPanel(ctx, 480, 310, 380, 270, { glow: true });
    A.drawStars(ctx, 670, 400, 2, 44, t);
    [0, 0.3, 0.7, 1].forEach(function (p, i) { A.drawProgressBar(ctx, 560 + i * 80, 520, 60, p, ['#3ddc84', '#4da3ff', '#ffb02e', '#ff4f6d'][i]); });
    var lx = 900;
    Object.keys(A.LANES).forEach(function (k, i) { A.drawIcon(ctx, k, lx + 20, 350 + i * 50, 28); A.drawText(ctx, A.LANES[k].name, lx + 50, 350 + i * 50, { size: 18, align: 'left' }); });
  });

  section('menu', 'Menú principal (1280×720)', 1280, 720, function (ctx, t) {
    A.drawMenuBackground(ctx, t);
    A.drawLogo(ctx, 640, 210, 1.2, t);
    ['Jugar', 'Co-op local', 'Opcions'].forEach(function (s, i) {
      A.drawButton(ctx, 470, 400 + i * 66, 340, 52, s, i === 0, t);
    });
    A.drawIcon(ctx, 'globe', 1230, 40, 30);
  });

  // ---------------------------------------------------------------- escena
  var MAP = [
    '##################',
    '#FBD.KKSS.TT.Y..p#',
    '#...........Y...r#',
    '#C.N..CCCC..C..LC#',
    '#C..............Q#',
    '#P..CC>>>>..N..CC#',
    '#P..............R#',
    '#CC.X..CCwKK..CCE#',
    '##################'
  ];
  var CODES = { '#': 'wall', F: 'src_budget', B: 'src_plan', D: 'src_report', K: 'desk', S: 'printer', T: 'approval', P: 'folder_stack', Y: 'meeting_room',
    R: 'minutes', X: 'shredder', Q: 'coffee', L: 'phone', N: 'team_desk', p: 'plant', r: 'bookshelf', w: 'whiteboard', '>': 'conveyor', C: 'counter', E: 'counter' };
  function scene(ctx, theme, t, dark) {
    A.drawBackground(ctx, theme, t);
    A.drawFloor(ctx, theme, 18, 9, 64, 128, 64, t);
    var ox = 64, oy = 128;
    var chars = [
      { x: ox + 5.5 * 64, y: oy + 2.85 * 64, dir: { x: 0, y: -1 }, colorIndex: 0, hair: 0, action: 'typing', energy: 0.8, name: 'P1', selected: true },
      { x: ox + 11.3 * 64, y: oy + 4.6 * 64, dir: { x: 1, y: 0.2 }, colorIndex: 1, hair: 1, moving: true, walkPhase: t * 10, carrying: true, energy: 0.25, name: 'P2', item: { kind: 'approved', lane: 'plan' } },
      { x: ox + 15.5 * 64, y: oy + 3.9 * 64, dir: { x: 0, y: -1 }, colorIndex: 2, hair: 3, action: 'calling', energy: 1 },
      { x: ox + 4.5 * 64, y: oy + 7.85 * 64, dir: { x: 0, y: -1 }, colorIndex: 3, hair: 2, action: 'spraying', energy: 1 }
    ];
    var mgr = { x: ox + 2.5 * 64, y: oy + 4.9 * 64, dir: { x: 1, y: 0 }, talking: true };
    var items = { '1,4': { kind: 'brief', lane: 'budget' }, '3,7': { kind: 'draft', lane: 'report' }, '1,7': { kind: 'printout', lane: 'plan' }, '1,10': { kind: 'approved', lane: 'budget' }, '1,12': { kind: 'dossier', contents: ['budget', 'plan'] }, '7,16': { kind: 'extinguisher' }, '5,7': { kind: 'brief', lane: 'report' } };
    var npcI = 0;
    for (var r = 0; r < 9; r++) {
      for (var c = 0; c < 18; c++) {
        var ch = MAP[r][c], ty = CODES[ch]; if (!ty) continue;
        var st = { type: ty, theme: theme, state: 'idle', dir: 'right' };
        if (ty === 'desk' && c === 5) { st.state = 'working'; st.progress = 0.6; st.highlight = true; }
        if (ty === 'printer' && c === 7) { st.state = 'working'; st.progress = 0.4; }
        if (ty === 'printer' && c === 8) st.state = 'warning';
        if (ty === 'desk' && r === 7 && c === 10) st.state = 'fire';
        if (ty === 'approval' && c === 11) st.blocked = true;
        if (ty === 'meeting_room' && r === 2) { st.joinTop = true; st.busy = 0.7; }
        if (ty === 'phone') { st.ringing = true; }
        if (ty === 'team_desk') { st.npc = NPCS[npcI++]; st.wants = npcI === 1; }
        if (ty === 'minutes') st.state = 'working';
        A.drawStation(ctx, st, ox + c * 64, oy + r * 64, 64, t);
        if (st.state === 'fire') A.drawFire(ctx, ox + c * 64, oy + r * 64, 64, 0.8, t);
        var it = items[r + ',' + c];
        if (it) { var an = A.itemAnchor(ty, 64); A.drawItem(ctx, it, ox + c * 64 + an.x, oy + r * 64 + an.y, 1, t); }
      }
      chars.forEach(function (p) {
        if (p.y >= oy + r * 64 && p.y < oy + (r + 1) * 64) {
          A.drawCharacter(ctx, p, t);
          if (p.carrying && p.item) { var cp = A.getCarryPoint(p); A.drawItem(ctx, p.item, cp.x, cp.y, 0.85, t); }
        }
      });
      if (mgr.y >= oy + r * 64 && mgr.y < oy + (r + 1) * 64) A.drawManager(ctx, mgr, t);
      if (r === 3) A.drawBug(ctx, { x: ox + 11.5 * 64, y: oy + 1.4 * 64, angle: 0.4, phase: t * 18, variant: 'mail' }, t);
      if (r === 6) A.drawBug(ctx, { x: ox + 8.6 * 64, y: oy + 6.7 * 64, angle: 0, squashed: 1 }, t);
      if (r === 5) A.drawBug(ctx, { x: ox + 9.4 * 64, y: oy + 4.2 * 64, angle: 2.4, phase: t * 18, variant: 'chat' }, t);
    }
    A.drawRocket(ctx, ox + 12.5 * 64, oy + 2.8 * 64, t, 0.35);
    FX.draw(ctx);
    if (dark > 0) {
      var lights = [];
      chars.forEach(function (p) { lights.push({ x: p.x, y: p.y - 30, r: 130, color: A.PLAYER_COLORS[p.colorIndex] }); });
      lights.push({ x: ox + 5.5 * 64, y: oy + 1 * 64, r: 110, color: '#5aa0ff' }, { x: ox + 10.5 * 64, y: oy + 7.4 * 64, r: 160, color: '#ff6a1f' });
      A.drawLighting(ctx, lights, dark);
    }
    demoOrders().slice(0, 5).forEach(function (o, i) { o.entering = 1; A.drawOrderCard(ctx, o, 20 + i * 172, 10, 162, 96, t); });
    A.drawPanel(ctx, 1060, 16, 200, 84, { radius: 14 });
    A.drawIcon(ctx, 'coin', 1090, 42, 26); A.drawText(ctx, '1.240', 1170, 42, { size: 24, color: '#ffd23f' });
    A.drawIcon(ctx, 'clock', 1090, 78, 22); A.drawText(ctx, '1:42', 1170, 78, { size: 20 });
  }
  function seedFX() {
    FX.clear();
    FX.spawn('glyphs', 5.5 * 64, 64 + 1 * 64, { count: 4 });
    FX.spawn('postits', 12.5 * 64, 64 + 2 * 64, { count: 10 });
    FX.spawn('text', 9 * 64, 64 + 6 * 64, { text: '+120', color: '#ffd23f' });
    for (var i = 0; i < 20; i++) FX.update(0.016);
  }
  if (Q.theme || SEC === 'scene') {
    var th = Q.theme || 'coworking';
    section('scene', 'Escena: ' + th, 1280, 720, function (ctx, t) { scene(ctx, th, t, +(Q.dark || 0)); });
  }
  if (SEC === 'scenes' || SEC === 'all') {
    THEMES.forEach(function (th) { section('scenes', 'Escena: ' + th, 1280, 720, function (ctx, t) { scene(ctx, th, t, th === 'quarterclose' ? 0.6 : th === 'corporate' ? 0.3 : 0); }); });
  }

  section('bgs', 'Fons de paret per tema (franja superior)', 1280, 5 * 140, function (ctx, t) {
    THEMES.forEach(function (th, i) {
      ctx.save(); ctx.beginPath(); ctx.rect(0, i * 140, 1280, 135); ctx.clip(); ctx.translate(0, i * 140);
      A.drawBackground(ctx, th, t); A.drawFloor(ctx, th, 18, 9, 64, 128, 64, t);
      ctx.restore(); label(ctx, th, 40, i * 140 + 130, '#ffd23f');
    });
  });

  section('fx', 'FX: partícules (instant)', 1280, 300, function (ctx, t) {
    ctx.fillStyle = '#2c3a4a'; ctx.fillRect(0, 0, 1280, 300);
    var K = ['sparks', 'smoke', 'confetti', 'postits', 'glyphs', 'steam', 'coins', 'foam', 'zzz', 'dust', 'text'];
    FX.clear();
    K.forEach(function (k, i) {
      FX.spawn(k, 60 + i * 112, 200, { text: k === 'text' ? OW.t('art.meeting_done') : undefined, color: k === 'text' ? '#3ddc84' : undefined, dir: { x: 1, y: 0 }, count: k === 'zzz' ? 3 : undefined });
    });
    for (var i = 0; i < 18; i++) FX.update(0.016);
    FX.draw(ctx);
    K.forEach(function (k, i) { label(ctx, k, 60 + i * 112, 280, '#fff'); });
  });

  var canvases = [];
  sections.forEach(function (s) {
    if (SEC !== 'all' && s.id !== SEC) return;
    if (SEC === 'all' && s.id === 'scene') return;
    var h2 = document.createElement('h2'); h2.textContent = s.title; document.body.appendChild(h2);
    var c = document.createElement('canvas'); c.width = s.w * Z; c.height = s.h * Z; document.body.appendChild(c);
    canvases.push({ s: s, c: c, g: c.getContext('2d') });
  });
  function frame(t) {
    canvases.forEach(function (o) {
      var g = o.g; g.setTransform(Z, 0, 0, Z, 0, 0); g.clearRect(0, 0, o.s.w, o.s.h);
      if (o.s.id === 'scenes' || o.s.id === 'scene') seedFX();
      try { o.s.draw(g, t); } catch (e) { window.onerror(e.message + ' [' + o.s.id + ']', e.stack && e.stack.split('\n')[1], 0, 0, e); }
    });
  }
  var t0 = performance.now();
  if (ANIM) {
    (function loop() { var t = (performance.now() - t0) / 1000 + T0; frame(t); requestAnimationFrame(loop); })();
  } else frame(T0);
  if (Q.perf) {
    var pc = A.canvas(1280, 720), pg = pc.getContext('2d'), tt = performance.now();
    for (var f = 0; f < 60; f++) {
      A.drawBackground(pg, 'coworking', f / 60); A.drawFloor(pg, 'coworking', 18, 9, 64, 128, 64, f / 60);
      for (var k = 0; k < 162; k++) A.drawStation(pg, { type: TYPES[k % TYPES.length], theme: 'coworking', npc: NPCS[0] }, 64 + (k % 18) * 64, 128 + Math.floor(k / 18) * 64, 64, f / 60);
      for (var q = 0; q < 4; q++) A.drawCharacter(pg, { x: 300 + q * 100, y: 400, colorIndex: q, moving: true }, f / 60);
    }
    document.title = 'PERF ms/frame=' + ((performance.now() - tt) / 60).toFixed(2);
  }
  if (!window.__errors.length && document.title.indexOf('PERF') < 0) document.title = 'OK';
})();
